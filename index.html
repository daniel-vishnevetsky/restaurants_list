<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאגר המסעדות של דניאל וישנבצקי</title>
    <!-- טעינת ספריות המפה של Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --primary: #2575fc;
            --secondary: #6a11cb;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #1a1a1a;
        }
        p.subtitle {
            color: #555;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        /* עיצוב תיבת החיפוש והכפתור שביקשת */
        .ai-chat-box {
            max-width: 650px;
            margin: 0 auto 20px auto;
            background: white;
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            gap: 10px;
        }
        .ai-chat-box input {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }
        .ai-chat-box button {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .ai-chat-box button:hover {
            opacity: 0.9;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        select, button.gps-btn {
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            background: white;
        }
        button.gps-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #map {
            width: 100%;
            max-width: 1200px;
            height: 400px;
            margin: 0 auto 25px auto;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card h3 {
            margin: 0 0 12px 0;
            color: #2c3e50;
        }
        .card p {
            margin: 6px 0;
            color: #555;
            font-size: 0.95rem;
        }
        .meta-info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .badge {
            background: #eef2f7;
            color: #333;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .maps-btn {
            display: block;
            text-align: center;
            background: #4285F4;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .maps-btn:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>

    <header>
        <h1>מאגר המסעדות של דניאל וישנבצקי</h1>
        <p class="subtitle">מאגר של מסעדות שמבוסס על ביקור בפועל והמלצות של מסעדות באינסטגרם. כולל עגלות קפה וארוחות בוקר, בתי קפה ותה, קונדיטוריות וגלידריות, אוכל עולמי, אוכל מהיר, חומוסיות, פיצות ופסטות, מסעדות שף וגורמה, סטייקים, דגים, פאבים ויקבים.</p>
    </header>

    <!-- תיבת החיפוש החכם יחד עם כפתור "שאל את המאגר" שביקשת -->
    <div class="ai-chat-box">
        <input type="text" id="searchInput" placeholder="חפש חופשי (למשל: 'אסייתי קרית ביאליק', 'המבורגר')..." onkeydown="if(event.key === 'Enter') filterRestaurants()">
        <button onclick="filterRestaurants()">שאל את המאגר 🤖</button>
    </div>

    <div class="controls">
        <select id="areaFilter" onchange="filterRestaurants()">
            <option value="">כל האזורים</option>
            <option value="השרון והסביבה">השרון והסביבה</option>
            <option value="הצפון והגליל">הצפון והגליל</option>
            <option value="הקריות">הקריות</option>
            <option value="נתניה">נתניה</option>
            <option value="חיפה">חיפה</option>
        </select>
    </div>

    <!-- מפה אינטראקטיבית -->
    <div id="map"></div>

    <div class="grid" id="restaurantsGrid">
        <!-- המסעדות יטענו לכאן אוטומטית -->
    </div>

    <script>
        let restaurants = [];
        let map;
        let markersLayer = L.layerGroup();

        function initMap() {
            if (map) return;
            map = L.map('map').setView([32.7940, 34.9890], 9);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            markersLayer.addTo(map);
        }

        async function loadData() {
            try {
                const response = await fetch('restaurants.json');
                restaurants = await response.json();
                initMap();
                displayRestaurants(restaurants);
            } catch (error) {
                console.error("שגיאה בטעינת נתונים:", error);
            }
        }

        function displayRestaurants(data) {
            const grid = document.getElementById('restaurantsGrid');
            grid.innerHTML = '';
            markersLayer.clearLayers();

            if (data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #777;">לא נמצאו מסעדות תואמות לחיפוש.</p>';
                return;
            }

            data.forEach(r => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div>
                        <h3>${r.name}</h3>
                        <p><strong>כתובת:</strong> ${r.address}</p>
                        <p><strong>מטבח/סגנון:</strong> ${r.style || r.category}</p>
                        <div class="meta-info">
                            <span class="badge">כשרות: ${r.kosher}</span>
                        </div>
                    </div>
                    <a class="maps-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ' ' + r.address)}" target="_blank">נווט עם Google Maps</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterRestaurants() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedArea = document.getElementById('areaFilter').value;

            const keywords = searchQuery.split(/\s+/).filter(word => word.length > 0);

            const filtered = restaurants.filter(r => {
                const fullText = `${r.name} ${r.address} ${r.style || ''} ${r.category || ''} ${r.area || ''} ${r.kosher || ''}`.toLowerCase();
                const matchesSearch = keywords.length === 0 || keywords.every(keyword => fullText.includes(keyword));
                const matchesArea = selectedArea === "" || r.area === selectedArea;

                return matchesSearch && matchesArea;
            });

            displayRestaurants(filtered);
        }

        loadData();
    </script>
</body>
</html>
